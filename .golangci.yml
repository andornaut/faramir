version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G109 # strconv.Atoi to int32 - uid and gid values from the passwd database
        - G115 # integer conversion overflow - uid/gid and fd conversions
        - G204 # subprocess launched with variable - running commands is the tool's purpose
        - G301 # directory permissions 0755 are standard and appropriate
        - G304 # file operations with user paths are the tool's purpose
        - G703 # path traversal - validating user paths is the tool's purpose
        - G704 # SSRF taint analysis - the only dials are to unix sockets
        - G705 # XSS taint analysis - the only writes are to a terminal and to stdio
        - G706 # log injection - logging environment variables
    govet:
      disable:
        - fieldalignment
        # Local to this repository. Every other Go repository here runs shadow
        # and passes; this one uses `if err := f(); err != nil` inside functions
        # that already hold an err often enough that the check reports 88 of
        # them, none a bug. Re-enable if those are ever unwound.
        - shadow
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests get a longer leash than the code they exercise: fixture literals
      # repeat by nature (goconst), helpers take parameters only some cases use
      # (unparam), and the untrusted input gosec warns about is input the test
      # wrote itself.
      - linters:
          - goconst
          - gosec
          - unparam
        path: _test\.go
      # errcheck stays narrow. Tearing down what a test set up is
      # fire-and-forget, and so is a write that cannot fail; a dropped error
      # anywhere else in a test is a test that passes without checking anything.
      # os.Setenv rather than t.Setenv because TestMain holds no *testing.T.
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value of `([\w.]+\.(Close|Serve)|os\.(Remove|RemoveAll|Setenv)|fmt\.Fprint)` is not checked
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/andornaut/faramir)
  exclusions:
    generated: lax
