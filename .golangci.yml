version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G109 # strconv.Atoi to int32 - uid and gid values from the passwd database
        - G115 # integer conversion overflow - uid/gid and fd conversions
        - G204 # subprocess launched with variable - running commands is the tool's purpose
        - G301 # directory permissions 0755 are standard and appropriate
        - G304 # file operations with user paths are the tool's purpose
        - G703 # path traversal - validating user paths is the tool's purpose
        - G704 # SSRF taint analysis - the only dials are to unix sockets
        - G705 # XSS taint analysis - the only writes are to a terminal and to stdio
        - G706 # log injection - logging environment variables
    govet:
      disable:
        # Packs struct fields by size. These are CLIs and a broker, where no
        # struct is allocated often enough for the bytes to matter, and field
        # order is how a reader finds related fields together.
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests get a longer leash than the code they exercise, but only where the
      # finding is about being a test: fixture literals repeat by nature
      # (goconst) and helpers take parameters only some cases use (unparam).
      - linters:
          - goconst
          - unparam
        path: _test\.go
      # gosec by rule rather than wholesale, so everything it checks still
      # applies to tests except the four that only describe a fixture: a file
      # written 0644 into a temp dir the test made (G306, G302, G301), and a
      # password spelled out in the fixture that is the point of the fixture
      # (G101).
      - linters:
          - gosec
        path: _test\.go
        text: G(101|301|302|306)
      # Local to this repository. Every `err` shadow here is the same shape:
      # `if err := f(); err != nil` in a function whose outer err has already
      # been returned, so the shadowed one is dead and renaming 88 of them would
      # cost the tight scope that idiom exists for. Scoped to the message rather
      # than disabling the analyzer, so shadowing anything other than err is
      # still reported.
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/andornaut/faramir)
  exclusions:
    generated: lax
