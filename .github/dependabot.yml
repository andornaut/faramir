version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The lab images the integration tests build. A gomod entry at "/" does not
  # reach a Dockerfile, and a docker entry at "/" does not reach a subdirectory.
  - package-ecosystem: "docker"
    directory: "/tests/lab"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
