name: Release

# Publishing is called only after the canonical validation DAG succeeds.
on:
  workflow_call:
    inputs:
      source_sha:
        description: The source revision validated by the calling workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: a release job still running at
    # fifteen minutes has hung rather than failed.
    timeout-minutes: 15
    steps:
      - name: Require the validated event revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: '[ "$SOURCE_SHA" = "$EVENT_SHA" ]'

  goreleaser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # The compiler container receives Git metadata without checkout credentials.
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify the validated source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          [ "$SOURCE_SHA" = "$EVENT_SHA" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Publish the versioned release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-release:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify the validated source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          [ "$SOURCE_SHA" = "$EVENT_SHA" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      # Matched by name, not merged blindly: `files: artifacts/*` publishes
      # whatever lands here, so the coverage artifact the called test workflow
      # uploads would otherwise become a dev-release asset no checksum covers.
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          pattern: faramir_*
          merge-multiple: true

      # As goreleaser does for a tag. The consumer can then verify what it
      # fetched, which matters more here than there: `dev` is a moving tag, so a
      # download that straddles a re-cut would otherwise install a mixed set
      # silently.
      - name: Write checksums
        run: cd artifacts && sha256sum -- *.tar.gz > checksums.txt

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push (tag
      # protection, or credentials the checkout did not persist) has to fail
      # the job rather than quietly publish binaries with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/*
