name: Test

# One event entrypoint validates each source revision before publishing it.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  attribution-scan:
    uses: ./.github/workflows/ai-attributions.yml

  ai-attributions:
    name: AI attributions
    needs: attribution-scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the attribution scan
        run: '[ "${{ needs.attribution-scan.result }}" = success ]'

  # Linux only: the broker reads peer credentials with SO_PEERCRED and the
  # executor allocates PTYs with TIOCGPTN, neither of which exists on macOS.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify, build and test Go
        run: |
          tests/e2e/e2e.sh fetch
          CGO_ENABLED=1 FARAMIR_TEST_OUT=bin tests/go/run.sh \
            bash tests/container/check test-go

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: bin/coverage.txt
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check source and documentation
        run: tests/container/run lint

  # The functional suites, against a real install in a container: systemd units,
  # three uids, a sops store and an agent working in a project tree. Go covers
  # the code; these cover what an operator gets after `faramir init`.
  #
  # Required rather than left to run on its own, expensive as it is: it needs
  # Docker and a container with its own writable cgroup subtree, and nothing else
  # here builds the image or asks doctor a question against a real install. A
  # base-image bump changes the userland every group and permission check reads,
  # so without this a bump merges on a green run that never built it.
  prepare-e2e:
    name: Prepare E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select the binary version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          build_version=dev
          if [ "$REF_TYPE" = tag ]; then
            build_version="${REF_NAME#v}"
          fi
          echo "version=$build_version" >> "$GITHUB_OUTPUT"

      - name: Build the E2E binaries
        run: tests/artifacts.sh e2e
        env:
          FARAMIR_BUILD_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload the E2E binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-binaries-${{ github.sha }}
          path: |
            tests/e2e/faramir
            tests/e2e/faramir-skew
            tests/e2e/binaries.manifest
          if-no-files-found: error

  e2e:
    name: E2E
    needs: prepare-e2e
    runs-on: ubuntu-latest
    # Includes cold package installation and the complete arrangement's suites.
    timeout-minutes: 20
    # Both sudo implementations: they take different settings out of the same
    # /etc/sudoers.d, so `--allow-sudo` installs a different arrangement for each
    # and only one of them is exercised by a run that does not say which.
    #
    # A matrix rather than `./e2e.sh both`, which runs them at once: that is
    # right on a desktop and a bad bet on a 2-CPU runner, a stack being a
    # private-cgroup systemd container and an sshd host. Separate jobs also name
    # which arrangement failed without reading a combined log.
    strategy:
      fail-fast: false
      matrix:
        sudo: [sudo, sudo-rs]
    env:
      SUDO: ${{ matrix.sudo }}
      E2E_PREBUILT: "1"
      FARAMIR_BUILD_VERSION: ${{ needs.prepare-e2e.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the E2E binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-binaries-${{ github.sha }}
          path: tests/e2e

      - name: Restore executable modes
        run: chmod 0755 tests/e2e/faramir tests/e2e/faramir-skew

      # sops, age and age-keygen, pinned by version and sha256 in e2e.sh. The
      # image has no network, so it installs what it finds in the build context.
      - name: Fetch the third-party binaries
        working-directory: tests/e2e
        run: ./e2e.sh fetch

      # Builds the image, starts the containers and bootstraps an install. The
      # container owns a private cgroup subtree, which is what a
      # socket-activated Type=notify unit needs to behave as it does on a host.
      - name: Bring the container up
        working-directory: tests/e2e
        run: ./e2e.sh up

      - name: Run every suite
        working-directory: tests/e2e
        run: ./e2e.sh run

      # The suites print one line per check and the failing ones are what a
      # reader wants; `run` already exits non-zero, so this only tidies up.
      - name: Tear the container down
        if: always()
        working-directory: tests/e2e
        run: ./e2e.sh down

  # The check the require-ci ruleset names. A matrix reports one check per leg,
  # "E2E (sudo)" and "E2E (sudo-rs)", and neither answers to a rule naming "E2E":
  # the suffix is part of the name. This job is that name, and it passes only if
  # every arrangement did.
  e2e-result:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-e2e, e2e]
    if: always()
    steps:
      - name: Every arrangement passed
        run: |
          [ "${{ needs.prepare-e2e.result }}" = success ]
          [ "${{ needs.e2e.result }}" = success ]

  build-platform:
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    # The platforms .goreleaser.yaml builds for a tag. Linux only: the broker
    # reads peer credentials with SO_PEERCRED and the executor allocates PTYs
    # with TIOCGPTN. CGO_ENABLED=0 makes every one of these a cross-compile the
    # runner can do on its own.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: x86_64
          - goos: linux
            goarch: arm64
            asset_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build
        run: tests/artifacts.sh build '-s -w'
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # Named and laid out like the archives goreleaser publishes for a tag, so
      # what installs a tagged release installs a dev one by changing the URL
      # and nothing else. An asset whose name does not carry its platform is one
      # a consumer has to be told about out of band.
      - name: Archive
        run: |
          cp README.md LICENSE bin/
          tar -czf faramir_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz -C bin .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: faramir_${{ matrix.goos }}_${{ matrix.asset_arch }}
          path: faramir_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz

  # A matrix leg reports as `build-platform (linux, amd64, x86_64)`, a name that
  # changes whenever the matrix does, and a required check that stops reporting
  # blocks every pull request forever. This job reports under one stable name,
  # so branch protection has a single check to require no matter how the matrix
  # grows.
  #
  # `always()` and not `!cancelled()`, which looks tidier and is a hole: a
  # cancelled run would skip this job, and GitHub counts a skipped required
  # check as passing, so an unverified commit becomes mergeable. Failing closed
  # costs a red check on runs that were cancelled anyway.
  build:
    name: Build
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check that every platform built
        run: '[ "${{ needs.build-platform.result }}" = success ]'

  publish:
    needs: [test, lint, e2e-result, build, ai-attributions]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      source_sha: ${{ github.sha }}
