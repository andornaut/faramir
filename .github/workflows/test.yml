name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Linux only: the broker reads peer credentials with SO_PEERCRED and the
  # executor allocates PTYs with TIOCGPTN, neither of which exists on macOS.
  test:
    name: Test
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # eight minutes, so a job still going at fifteen has hung rather than
    # failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The opencode and Kilo Code plugins are JavaScript that node runs, and the
      # tests exercise the shipped file rather than a description of it. Without
      # node those tests skip, which is a silent loss of the whole plugin suite:
      # pinned here rather than relying on what the runner image happens to ship.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      # `faramir vault edit` and `faramir recipient reseal` hand sops the install's creation rules
      # rather than letting it search from the working directory, and the tests
      # that hold that line assert how sops itself resolves and matches a rule.
      # The stand-in built from the sops libraries models no creation rules, so
      # those tests skip without the real binary, and what would go unrun is the
      # guard against a .sops.yaml planted in the agent's tree writing managed
      # values in cleartext. `make test` still needs no sops: this installs it
      # for CI alone.
      #
      # The version and digest are read out of e2e.sh rather than restated here,
      # so a bump moves both at once: two copies with nothing tying them together
      # is CI testing one binary while the suites test another, and no run says so.
      - name: Install sops
        run: |
          eval "$(grep -E '^SOPS_(VERSION|SHA256)=' tests/e2e/e2e.sh)"
          test -n "${SOPS_VERSION}" && test -n "${SOPS_SHA256}"
          curl -sSfLo /tmp/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version --disable-version-check

      - name: Verify dependencies
        run: go mod verify

      # verify checks the downloaded modules against go.sum, and says nothing
      # about whether go.mod still describes what the code imports: a dependency
      # that became direct keeps its // indirect marker until someone runs tidy,
      # and the next contributor to run it finds a dirty tree.
      - name: The module file must be tidy
        run: go mod tidy -diff

      - name: Build
        run: go build -v ./...

      # Every brokered command is confined to its own cgroup and reaped there,
      # with no process-group fallback, so the executor refuses to run where it
      # cannot make a cgroup, and the tests exercise that real path rather than a
      # weaker one. The GitHub runner is unprivileged and sits in a root-owned
      # service cgroup it cannot subdivide, so hand it one it owns (exactly as
      # `init` grants the executor unit Delegate= on a real host) and move this
      # shell into it: `go test` inherits it and confinement runs for real.
      - name: Delegate a cgroup to the runner, then run tests
        run: |
          CG=/sys/fs/cgroup/faramir-test
          sudo mkdir -p "$CG"
          sudo chown -R "$(id -u):$(id -g)" "$CG"
          echo $$ | sudo tee "$CG/cgroup.procs" > /dev/null
          # Prove it took. Without a delegated cgroup the executor refuses every
          # command and a couple of dozen tests skip, which is a green run that
          # checked none of the confinement or the executor.
          test -w "$CG/cgroup.procs" && grep -q faramir-test /proc/self/cgroup \
            || { echo "cgroup delegation failed; the executor tests would all skip"; exit 1; }
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.0
          # Verification fetches a JSONSchema from golangci-lint.run on every
          # run, so this step depends on that host being reachable. Kept on
          # regardless: `run` accepts an unknown key inside `linters.settings`
          # and exits 0, which leaves that setting disabled while CI stays
          # green, and only `config verify` rejects it. An unknown linter name
          # is caught either way.
          verify: true

      # -x follows a `source` into the file it names and -P SCRIPTDIR looks for
      # it beside the script doing the sourcing, which shellcheck cannot resolve
      # on its own. Set everywhere rather than only where something sources
      # today, so a script that starts to is already covered.
      #
      # node_modules is skipped because a Lint job that installs dependencies
      # would otherwise answer for shell a dependency ships.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          # Pinned rather than the action's `stable` default, which names a
          # moving release the action downloads at run time: without this a
          # ShellCheck release turns every one of these gates red on a commit
          # that did not touch them. Dependabot does not read an action input,
          # so this moves by hand.
          version: v0.11.0
          ignore_paths: node_modules
          scandir: "."

      # The release config, checked here rather than at the tag. goreleaser
      # validates it as `release` starts, which is after the tag is pushed and
      # protect-release-tags has no bypass to take one back with. Held to the
      # same version constraint as the release job, since a check run against a
      # different goreleaser says nothing about the one that will publish, and
      # floating is the point: a deprecation lands on a push here rather than
      # on the one run that cannot be repeated.
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      # The action bundles markdownlint-cli2, so its own tag is the tool pin and
      # Dependabot proposes the bump through the github-actions ecosystem. It
      # fetches nothing at run time, so a slow host cannot turn this red.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          # Empty on purpose. The action defaults this to `*.{md,markdown}`,
          # which is the repository root only, and anything passed here outranks
          # the `globs` in .markdownlint-cli2.yaml. Empty leaves the config file
          # deciding, so this gate and a local `markdownlint-cli2` read one list.
          globs: ""

  # The functional suites, against a real install in a container: systemd units,
  # three uids, a sops store and an agent working in a project tree. Go covers
  # the code; these cover what an operator gets after `faramir init`.
  #
  # Required rather than left to run on its own, expensive as it is: it needs
  # Docker, a privileged container and the host's cgroup tree, and nothing else
  # here builds the image or asks doctor a question against a real install. A
  # base-image bump changes the userland every group and permission check reads,
  # so without this a bump merges on a green run that never built it.
  e2e:
    name: E2E arrangement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Both sudo implementations: they take different settings out of the same
    # /etc/sudoers.d, so `--allow-sudo` installs a different arrangement for each
    # and only one of them is exercised by a run that does not say which.
    #
    # A matrix rather than `./e2e.sh both`, which runs them at once: that is
    # right on a desktop and a bad bet on a 2-CPU runner, a stack being a
    # privileged systemd container and an sshd host. Separate jobs also name
    # which arrangement failed without reading a combined log.
    strategy:
      fail-fast: false
      matrix:
        sudo: [classic, rs]
    env:
      SUDO: ${{ matrix.sudo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # sops, age and age-keygen, pinned by version and sha256 in e2e.sh. The
      # image has no network, so it installs what it finds in the build context.
      - name: Fetch the third-party binaries
        working-directory: tests/e2e
        run: ./e2e.sh fetch

      # Builds the image, starts the containers and bootstraps an install. The
      # container needs --privileged and --cgroupns=host, which is what a
      # socket-activated Type=notify unit needs to behave as it does on a host.
      - name: Bring the container up
        working-directory: tests/e2e
        run: ./e2e.sh up

      - name: Run every suite
        working-directory: tests/e2e
        run: ./e2e.sh run

      # The suites print one line per check and the failing ones are what a
      # reader wants; `run` already exits non-zero, so this only tidies up.
      - name: Tear the container down
        if: always()
        working-directory: tests/e2e
        run: ./e2e.sh down

  # The check the require-ci ruleset names. A matrix reports one check per leg
  # ("E2E arrangement (classic)" and "(rs)"), so nothing would answer to "E2E"
  # and the rule could never be satisfied. This is that name, and it passes only
  # if every arrangement did.
  e2e-result:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e
    if: always()
    steps:
      - name: Every arrangement passed
        run: |
          echo "e2e matrix result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = success ]
