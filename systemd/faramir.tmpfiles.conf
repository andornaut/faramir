# Installed as /etc/tmpfiles.d/faramir.conf.
#
# /run/faramir holds the three activation sockets systemd creates from the
# .socket units, plus the ssh-agent socket the broker creates for brokered
# commands.
#
# The directory is created here rather than by RuntimeDirectory= on one of the
# services: systemd chowns a RuntimeDirectory recursively whenever its owner
# does not match the unit's User=, and that rewrites the SocketUser= and
# SocketGroup= of every socket already inside it.  Two units claiming the same
# RuntimeDirectory chown it away from each other on every start, which leaves
# broker.sock 0660 faramir-broker:faramir-broker: the agent uid gets EACCES and
# the broker is unreachable.
#
# Owner is the broker because it is the only uid that creates anything here.
# 0755 so the other uids can traverse to the sockets, whose own modes decide
# who may connect.
d /run/faramir 0755 faramir-broker faramir-broker -
