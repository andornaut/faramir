# Take the age key from a TPM-sealed credential instead of a file on disk.
#
# Not installed by default, and not useful without a TPM.  Copy it to
# /etc/systemd/system/faramir-keeper.service.d/tpm-credential.conf after sealing
# the key; see "Encryption at rest" in the README.
#
# The credential is still named age_key, which is what [keeper]
# age_key_credential in config.toml refers to, so nothing else changes: the
# keeper reads $CREDENTIALS_DIRECTORY/age_key either way and never learns which
# source it came from.
#
# The empty LoadCredential= resets the list the shipped unit sets, so the
# plaintext path is no longer read at all.  Without that line systemd would
# refuse to start the unit, both entries claiming the same credential name.
[Service]
LoadCredential=
LoadCredentialEncrypted=age_key:/etc/faramir/age.key.cred
