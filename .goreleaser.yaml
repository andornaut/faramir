# This is a GoReleaser configuration for faramir
version: 2

project_name: faramir

before:
  hooks:
    - go mod tidy

# Linux only: the broker reads peer credentials with SO_PEERCRED and the
# executor allocates PTYs with TIOCGPTN, and the install is a systemd unit set.
builds:
  - id: faramir
    main: ./cmd/faramir
    binary: faramir
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

# One archive, holding the one binary and the README.  `faramir init` is given
# the directory it was unpacked into and copies what it finds there.
archives:
  - formats: [tar.gz]
    # this name template makes the output compatible with many package managers
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
