# This is a GoReleaser configuration for faramir
version: 2

project_name: faramir

# Linux only: the broker reads peer credentials with SO_PEERCRED and the
# executor allocates PTYs with TIOCGPTN, and the install is a systemd unit set.
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    main: ./cmd/faramir
    binary: faramir
    # -trimpath keeps the build machine's absolute paths out of the binary, and
    # -s -w drops the symbol table and DWARF. Declaring ldflags replaces
    # goreleaser's defaults rather than adding to them, so the version stamp has
    # to be restated here: without it a tagged binary reports the "dev" its
    # source declares. The dev build in release.yml passes the same pair without
    # the stamp, which is what makes a dev archive report dev.
    flags: [-trimpath]
    ldflags: ['-s -w -X github.com/andornaut/faramir/internal/version.Version={{.Version}}']

# One archive, holding the one binary plus the README and the licence for
# whoever unpacks it. `faramir init` needs only the binary: everything it
# writes to a host is embedded in it, and it installs the executable it is
# running from.
archives:
  - formats: [tar.gz]
    # this name template makes the output compatible with many package managers
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
