# /etc/faramir/config.toml -- broker policy.
#
# This starter allows two commands, both of which exist to demonstrate the
# broker rather than to do any particular job: `printenv`, which proves a
# credential reached the right variable, and `bash`, which is how a pipeline is
# requested.  Everything a deployment actually runs is a rule you add.
#
# etc/examples/ holds complete configs for real workloads, which are policy
# choices rather than defaults the broker should make for you:
#
#   ansible-fleet.toml   running Ansible against a fleet of managed hosts
#
# The allowlist is DEFAULT-DENY: a command matching no [[allow]] rule is
# refused.  Regexes are applied with re.search(), so anchor them.

[server]
socket_path = "/run/faramir/broker.sock"
socket_mode = "0660"
max_concurrency = 4
max_request_bytes = 262144
# Peer credentials are checked against these in addition to the socket mode.
allowed_groups = ["devwork"]
allowed_uids = []

# The process that holds the age key.  It runs as its own uid, execs nothing
# but sops, and has no operation that returns key material -- so no command the
# broker runs can reach the key that decrypts every managed file.
[keeper]
socket_path = "/run/faramir/keeper.sock"
socket_mode = "0660"
# The broker is the only legitimate client.  Checked with SO_PEERCRED, on top
# of the socket mode.
allowed_users = ["faramir-broker"]
allowed_groups = []
# Name of the systemd LoadCredential= entry in faramir-keeper.service.
age_key_credential = "age_key"

# The process that forks brokered commands.  Its uid holds nothing: no key, no
# secret values, no audit log, and no write access to the execution checkout.
# A child forked by the broker would inherit all four.
[executor]
socket_path = "/run/faramir/exec.sock"
socket_mode = "0660"
allowed_users = ["faramir-broker"]
allowed_groups = []
max_concurrency = 16

[exec]
# Required: where a command runs when the request does not say.  This is the
# broker's execution checkout, which install/10-accounts.sh creates.
default_cwd = "/srv/faramir"
default_timeout_sec = 600
max_timeout_sec = 3600
max_output_bytes = 1048576
allowed_bin_dirs = ["/usr/local/bin", "/usr/bin", "/bin", "/usr/local/sbin", "/usr/sbin"]
term_cols = 120
term_rows = 40
kill_grace_sec = 5

# The child's entire environment.  The broker's own environ is never inherited,
# so a tool that needs a variable needs it named here.
[exec.base_env]
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
TERM = "xterm-256color"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
DEBIAN_FRONTEND = "noninteractive"

# SSH keys for hosts a brokered command needs to reach.  Listing them here
# makes the broker load them into an agent it owns and pass only SSH_AUTH_SOCK
# to the child: the command can authenticate with them but cannot read them,
# and a leaked key is permanent in a way a leaked password is not.
#
# Leave `keys` empty to skip the agent entirely, in which case the keys have to
# live somewhere the executor's own uid can read (~faramir-exec/.ssh).
[ssh]
keys = []
# keys = ["/var/lib/faramir-broker/.ssh/id_ed25519"]
agent_socket = "/run/faramir/ssh-agent.sock"
agent_socket_mode = "0660"
exec_group = "faramir-exec"

[secrets]
# Every sops file the keeper manages.  ALL of their values go into the
# redaction value set, not just the ones injected into a given command: a
# managed host can print a credential the broker never injected.
# The broker stats these to notice edits; only the keeper can decrypt them.
files = ["/srv/faramir/secrets.sops.yml"]
decrypt_command = ["sops", "--output-type", "json", "--decrypt", "{file}"]
refresh_interval_sec = 5

# Values below these thresholds cannot be redacted -- a short or low-entropy
# value would blank out unrelated output at random -- so the broker refuses to
# load them at all.  It names each one in the log and in --check.
min_length = 8
min_unique_chars = 4
min_entropy_bits_per_char = 1.5

[audit]
raw_log = "/var/log/faramir/raw.log"
max_record_bytes = 4194304

[sync]
# The agent authors and commits; the broker executes only committed content.
# source and dest are required whenever this is enabled.
enabled = true
source = "/home/agent/work/repo"
dest = "/srv/faramir"
default_ref = "HEAD"
allowed_refs = ['^(HEAD|main|master|refs/heads/[A-Za-z0-9._/-]{1,100}|[A-Za-z0-9._/-]{1,100})$']
git = "/usr/bin/git"
clean = true
timeout_sec = 120

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------

# No rule receives the age key: there is no flag that grants it, and the broker
# does not hold it to grant.  A command that wants a secret is given it through
# env_refs and reads it from the environment.

# Exists so redaction is demonstrable end to end (verification test 3): the
# agent can prove a credential reached the right variable without seeing it.
# Harmless because output is redacted; drop it if you prefer.
#
# min_args/max_args, not just args_allow: args_allow describes the arguments
# that are present, so on its own it would still permit a bare `printenv`,
# which dumps the whole environment instead of naming one variable.
[[allow]]
name = "printenv"
argv0 = '^printenv$'
args_allow = ['^[A-Za-z_][A-Za-z0-9_]*$']
min_args = 1
max_args = 1
max_timeout_sec = 30

# bash is what makes pipelines possible: the broker never spawns a shell for
# the caller, so a pipeline has to be requested explicitly as
# ["bash", "-lc", "…"].  It is also the widest rule that ships -- removing it
# is the single biggest tightening available, at the cost of losing pipelines
# and of verification tests 4/5/10/11 in the README.
[[allow]]
name = "bash"
argv0 = '^(bash|sh)$'
args_allow = ['^-[lc]{1,2}$', '^-lc$', '^[^\x00]{0,8192}$']
args_deny = ['(^|\s)/etc/faramir', '/proc/\d+/environ']
