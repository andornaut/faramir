# A complete config.toml for running Ansible against managed hosts over SSH,
# with the broker holding the key.  Install it in place of the shipped starter:
#
#   sudo CONFIG=etc/examples/ansible-fleet.toml make install
#
# Every path below is absolute and installed verbatim, so there is nothing to
# substitute and nothing to edit here.
#
# It differs from etc/config.toml in the Ansible variables in [exec.base_env],
# the SSH keys that reach managed hosts, and the sops file it manages.  The
# paths the installer and the systemd units create (the sockets, the audit log)
# are the same, so nothing outside this file changes.
#
# If ansible-playbook is a pipx or venv install, put its directory on the PATH
# in [exec.base_env]: that is the PATH the child gets and where a bare command
# name is looked up.

[server]
socket_path = "/run/faramir/broker.sock"
socket_mode = "0660"
max_concurrency = 4
max_request_bytes = 262144
allowed_groups = ["dev"]
allowed_uids = []

[keeper]
socket_path = "/run/faramir/keeper.sock"
socket_mode = "0660"
allowed_users = ["faramir-broker"]
age_key_credential = "age_key"

[executor]
socket_path = "/run/faramir/exec.sock"
socket_mode = "0660"
allowed_users = ["faramir-broker"]
max_concurrency = 16

[exec]
# No working directory: a brokered command runs where its caller was, which for
# a playbook run is the checkout you typed it in.
default_timeout_sec = 600
max_timeout_sec = 3600
max_output_bytes = 1048576
term_cols = 120
term_rows = 40
kill_grace_sec = 5

# The child's entire environment.  The broker's own environ is never inherited,
# so anything Ansible needs has to be named here.
[exec.base_env]
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
TERM = "xterm-256color"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
DEBIAN_FRONTEND = "noninteractive"
ANSIBLE_FORCE_COLOR = "1"
ANSIBLE_HOST_KEY_CHECKING = "True"
ANSIBLE_NOCOWS = "1"

# The keys that reach managed hosts.  Listed here, the broker loads them into
# an agent it owns and passes the child only SSH_AUTH_SOCK, so a playbook can
# authenticate with them but no brokered command can copy them.
[ssh]
keys = ["/var/lib/faramir-broker/.ssh/id_ed25519"]
agent_socket = "/run/faramir/ssh-agent.sock"
agent_socket_mode = "0660"
exec_group = "faramir-exec"

[secrets]
# Named after what consumes the values, not after who owns them: every client
# that reaches the broker sees every ref regardless of which file it came from,
# so a per-operator name would imply an isolation nothing enforces.  Splitting
# by consumer or domain is what buys something: a decryption failure is reported
# per file, and a reload is triggered per file.
files = ["/etc/faramir/secrets/ansible-ctrl.sops.yml"]
decrypt_command = ["sops", "--output-type", "json", "--decrypt", "{file}"]
refresh_interval_sec = 5
min_length = 8
min_unique_chars = 4
min_entropy_bits_per_char = 1.5

[audit]
log_path = "/var/log/faramir/audit.log"
max_record_bytes = 4194304
