# A complete config.toml for running Ansible against a fleet, which is the
# workload faramir was built for.  Install it in place of the shipped starter:
#
#   sudo CONFIG=etc/examples/ansible-fleet.toml \
#        WORKTREE=/home/agent/work/ansible-ctrl make install
#
# WORKTREE names the tree.  It is written below as @WORKTREE@, which the
# installer substitutes everywhere before binding that one path into the three
# units, so there is nothing to edit here.
#
# It differs from etc/config.toml in the Ansible variables in [exec.base_env],
# the SSH keys that reach managed hosts, the sops file it manages, and the name
# of the working tree.  The paths the installer and the systemd units create
# (the sockets, the audit log) are the same, so nothing outside this file
# changes.
#
# If ansible-playbook is a pipx or venv install, put its directory on the PATH
# in [exec.base_env]: that is the PATH the child gets and where a bare command
# name is looked up.

[server]
socket_path = "/run/faramir/broker.sock"
socket_mode = "0660"
max_concurrency = 4
max_request_bytes = 262144
allowed_groups = ["devwork"]
allowed_uids = []

[keeper]
socket_path = "/run/faramir/keeper.sock"
socket_mode = "0660"
allowed_users = ["faramir-broker"]
age_key_credential = "age_key"

[executor]
socket_path = "/run/faramir/exec.sock"
socket_mode = "0660"
allowed_users = ["faramir-broker"]
max_concurrency = 16

[exec]
default_cwd = "@WORKTREE@"
default_timeout_sec = 600
max_timeout_sec = 3600
max_output_bytes = 1048576
term_cols = 120
term_rows = 40
kill_grace_sec = 5

# The child's entire environment.  The broker's own environ is never inherited,
# so anything Ansible needs has to be named here.
[exec.base_env]
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
TERM = "xterm-256color"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
DEBIAN_FRONTEND = "noninteractive"
ANSIBLE_FORCE_COLOR = "1"
ANSIBLE_HOST_KEY_CHECKING = "True"
ANSIBLE_NOCOWS = "1"

# The keys that reach managed hosts.  Listed here, the broker loads them into
# an agent it owns and passes the child only SSH_AUTH_SOCK, so a playbook can
# authenticate with them but no brokered command can copy them.
[ssh]
keys = ["/var/lib/faramir-broker/.ssh/id_ed25519"]
agent_socket = "/run/faramir/ssh-agent.sock"
agent_socket_mode = "0660"
exec_group = "faramir-exec"

[secrets]
files = ["@WORKTREE@/secrets/vault.sops.yml"]
decrypt_command = ["sops", "--output-type", "json", "--decrypt", "{file}"]
refresh_interval_sec = 5
min_length = 8
min_unique_chars = 4
min_entropy_bits_per_char = 1.5

[audit]
log_path = "/var/log/faramir/audit.log"
max_record_bytes = 4194304
